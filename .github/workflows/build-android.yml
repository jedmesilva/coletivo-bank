name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Expo
      uses: expo/expo-github-action@v8
      with:
        expo-version: latest
        token: ${{ secrets.EXPO_TOKEN }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: npm

    - name: Setup EAS
      uses: expo/expo-github-action@v8
      with:
        eas-version: latest
        token: ${{ secrets.EXPO_TOKEN }}

    - name: Create minimal Expo app
      run: |
        cat > package.json << 'EOF'
        {
          "name": "coletivo-bank",
          "version": "1.0.0",
          "main": "node_modules/expo/AppEntry.js",
          "scripts": {
            "start": "expo start",
            "android": "expo start --android"
          },
          "dependencies": {
            "expo": "~49.0.0",
            "react": "18.2.0",
            "react-native": "0.72.6",
            "expo-status-bar": "~1.6.0"
          },
          "devDependencies": {
            "@babel/core": "^7.20.0"
          }
        }
        EOF

        cat > App.js << 'EOF'
        import { StatusBar } from 'expo-status-bar';
        import { StyleSheet, Text, View } from 'react-native';

        export default function App() {
          return (
            <View style={styles.container}>
              <Text style={styles.title}>Coletivo Bank</Text>
              <Text style={styles.subtitle}>Sistema de Crédito Coletivo</Text>
              <StatusBar style="auto" />
            </View>
          );
        }

        const styles = StyleSheet.create({
          container: {
            flex: 1,
            backgroundColor: '#f8fafc',
            alignItems: 'center',
            justifyContent: 'center',
          },
          title: {
            fontSize: 32,
            fontWeight: 'bold',
            color: '#10b981',
            marginBottom: 10,
          },
          subtitle: {
            fontSize: 16,
            color: '#6b7280',
          },
        });
        EOF

        cat > app.json << 'EOF'
        {
          "expo": {
            "name": "Coletivo Bank",
            "slug": "coletivo-bank",
            "version": "1.0.0",
            "orientation": "portrait",
            "userInterfaceStyle": "light",
            "splash": {
              "backgroundColor": "#10b981"
            },
            "android": {
              "package": "com.coletivobank.app",
              "versionCode": 1,
              "adaptiveIcon": {
                "backgroundColor": "#10b981"
              }
            }
          }
        }
        EOF

        cat > eas.json << 'EOF'
        {
          "cli": {
            "version": ">= 5.2.0"
          },
          "build": {
            "development": {
              "developmentClient": true,
              "distribution": "internal"
            },
            "preview": {
              "android": {
                "buildType": "apk"
              }
            },
            "production": {}
          }
        }
        EOF

    - name: Install dependencies
      run: npm install

    - name: Build APK
      run: eas build --platform android --profile preview --local --output coletivo-bank.apk --non-interactive

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: coletivo-bank-apk
        path: coletivo-bank.apk

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Coletivo Bank v1.0.${{ github.run_number }}
        body: |
          📱 Coletivo Bank - APK Android
          
          Sistema de crédito coletivo em React Native.
          
          Instalação:
          1. Baixe o APK
          2. Habilite fontes desconhecidas
          3. Instale no Android
        files: coletivo-bank.apk