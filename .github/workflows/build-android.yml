name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js 
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create Basic React Native App
      run: |
        # Create simple package.json
        cat > package.json << 'EOF'
        {
          "name": "coletivo-bank",
          "version": "1.0.0",
          "main": "index.js",
          "scripts": {
            "start": "expo start"
          },
          "dependencies": {
            "expo": "~49.0.0",
            "react": "18.2.0",
            "react-native": "0.72.6"
          },
          "devDependencies": {
            "@babel/core": "^7.20.0"
          }
        }
        EOF

        # Create simple index.js
        cat > index.js << 'EOF'
        import { registerRootComponent } from 'expo';
        import App from './App';
        registerRootComponent(App);
        EOF

        # Create simple App.js
        cat > App.js << 'EOF'
        import React from 'react';
        import { StyleSheet, Text, View } from 'react-native';

        export default function App() {
          return (
            <View style={styles.container}>
              <Text style={styles.title}>Coletivo Bank</Text>
              <Text style={styles.subtitle}>Sistema de Crédito Coletivo</Text>
            </View>
          );
        }

        const styles = StyleSheet.create({
          container: {
            flex: 1,
            backgroundColor: '#f8fafc',
            alignItems: 'center',
            justifyContent: 'center',
          },
          title: {
            fontSize: 28,
            fontWeight: 'bold',
            color: '#10b981',
            marginBottom: 8,
          },
          subtitle: {
            fontSize: 16,
            color: '#6b7280',
          },
        });
        EOF

        # Create app config
        cat > app.json << 'EOF'
        {
          "expo": {
            "name": "Coletivo Bank",
            "slug": "coletivo-bank",
            "version": "1.0.0",
            "platforms": ["android"],
            "android": {
              "package": "com.coletivobank.app",
              "versionCode": 1
            }
          }
        }
        EOF

        # Create babel config
        cat > babel.config.js << 'EOF'
        module.exports = function(api) {
          api.cache(true);
          return {
            presets: ['babel-preset-expo'],
          };
        };
        EOF

    - name: Install Dependencies
      run: |
        npm install -g expo-cli@6.3.10
        npm ci

    - name: Expo Prebuild
      run: |
        expo prebuild --platform android --clear

    - name: Build APK
      run: |
        cd android
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        chmod +x ./gradlew
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: coletivo-bank-apk
        path: android/app/build/outputs/apk/release/app-release.apk

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        name: Coletivo Bank Build ${{ github.run_number }}
        body: APK Android gerado automaticamente
        files: android/app/build/outputs/apk/release/app-release.apk